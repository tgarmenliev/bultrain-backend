# Systemd drop-in for bultrain-backup.service — adds the off-box backup target
# without touching the base unit file (see the comment there for why).
#
# This is what is ACTUALLY deployed on the server today (confirmed via
# `systemctl cat bultrain-backup.service`, 2026-08-23). It had existed only on
# the box, made directly with no record in git — captured here so a server
# rebuild, or simply forgetting it exists, can't silently lose off-box backups
# again. The daily timer has been using it successfully since 2026-07-17.
#
# The bucket path here is not a secret (no different from a hostname); the
# actual B2 application key lives only in the server's rclone.conf, never here
# and never in git.

[Service]
Environment=BULTRAIN_BACKUP_REMOTE=b2:bultrain-backups/bultrain
